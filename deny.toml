# cargo-deny 配置（适配 cargo-deny 0.20.x）
# 校验目标：许可证合规、依赖来源可信、无重复/通配依赖。
# 安全公告（advisories）使用默认策略，仅对下列已知无害的条目显式豁免。

[advisories]
# RUSTSEC-2024-0370：`proc-macro-error 1.0.4` 已停止维护。
#
# 它来自 Linux 专属的 gtk-rs 0.18 链路：
#   tauri → wry → webkit2gtk → glib 0.18 → glib-macros → proc-macro-error
#
# 为什么豁免而不是修：
# 1. 升级路径不在本项目手里——gtk-rs 0.19+ 才换成 proc-macro-error2，
#    而版本由 tauri/wry 决定；我们无法单独把 glib-macros 提上去。
# 2. 该公告是「不再维护」，不是漏洞。proc-macro-error 只在编译期展开宏，
#    不进入运行时产物，也不处理不可信输入。
# 3. 影响面仅限 Linux 构建，Windows/macOS 的依赖树里没有它。
#
# 移除条件：tauri 升级到使用 gtk-rs 0.19+ 后，这条豁免应立即删除。
#
# RUSTSEC-2026-0370 / 0371 / 0372：`zvariant`、`zbus_names`、`zvariant_derive`
# 被标记为「不再作为独立 crate 维护」——注意公告措辞是 **no longer maintained
# as a standalone crate**，即这些子 crate 已并入 zbus 主 crate，而不是被弃用。
#
# 它们来自 `tauri-plugin-opener`（Linux 上通过 zbus 调用 xdg-desktop-portal 打开链接）：
#   qcl-desktop → tauri-plugin-opener → zbus → zvariant / zbus_names
#
# 为什么豁免而不是去掉插件：关于页的仓库链接需要它——Tauri 默认拦截外部导航，
# 没有插件时链接点了没有任何反应。三个公告都不是漏洞，且影响面仅限 Linux 构建。
#
# 移除条件：tauri-plugin-opener 改用 zbus 6+（子 crate 合回主干）后删除这三条。
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "来自 Linux 专属的 gtk-rs 0.18 链路（tauri→wry→webkit2gtk→glib-macros），升级权不在本项目；该公告是「停止维护」而非漏洞，且只在编译期展开宏" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 已并入 zbus 主 crate（公告为「不再作为独立 crate 维护」而非弃用）；来自 Linux 专属的 tauri-plugin-opener→zbus 链路" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 已并入 zbus 主 crate；同上，非漏洞" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 已并入 zbus 主 crate；同上，非漏洞" },
]

[licenses]
# 白名单策略：未列出的许可证一律拒绝。
# GPL-3.0 项目可兼容下列宽松/弱著佐权许可证；MPL-2.0 与 GPLv3 兼容。
confidence-threshold = 0.9
# 白名单中暂未出现的许可证只记录、不报错，避免骨架期误报。
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
exceptions = []

# 工作区自有 crate（publish = false）不参与许可证校验：
# 本项目自身以 GPL-3.0 发布，无需再与依赖白名单比对。
# 注意：这不会放宽对第三方依赖的要求——GPL 系许可证仍被排除在 allow 之外，
# 引入 GPL 依赖时必须显式修改白名单，从而形成一次有意识的决策。
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
