name: 缺陷报告
description: 启动器运行异常、崩溃或行为不符合预期
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issue，避免重复。
        安全漏洞请勿在此提交，见 [SECURITY.md](../blob/main/SECURITY.md)。
  - type: input
    id: launcher-version
    attributes:
      label: 启动器版本
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS（Apple Silicon）
        - macOS（Intel）
        - Linux
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: 游戏版本
      description: 如 26.3；若使用了模组加载器请一并注明版本
      placeholder: 26.3 / Fabric 0.20.1
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 请从「设置 → 控制台」导出日志。**上传前请删除其中可能包含的账号信息。**
      render: shell
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，未发现重复
          required: true
        - label: 日志中不包含我的账号凭据
          required: true
