name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先对照 [开发规划](../blob/main/docs/DEVELOPMENT_PLAN.md)，确认该功能不在已规划范围内或属于当前阶段。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述实际遇到的困扰，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 启动核心（下载 / 启动 / Java 管理）
        - 账号与登录
        - 界面与交互
        - 模组加载器 / 模组管理
        - 构建与发布
        - 其他
    validations:
      required: true
