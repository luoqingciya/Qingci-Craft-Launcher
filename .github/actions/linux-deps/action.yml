#
# 安装 Tauri 在 Linux 上需要的系统依赖。
#
# 抽成 composite action 的理由：clippy / test / coverage / build 四个 job 都需要，
# 原来各抄一份 `apt-get install`，改一次要改四处，而且很容易只改了其中三处。
#
# 两步各自解决一个问题：
#   1. 选最快的镜像——实测 apt 装这些依赖曾占掉 build job 305 秒里的 166 秒
#   2. 缓存 .deb——命中后不再走网络，这是真正的提速手段

name: Linux 构建依赖
description: 选最快的 apt 镜像并安装（带缓存）Tauri 所需系统依赖

runs:
  using: composite
  steps:
    - name: 选择最快的 apt 镜像
      shell: bash
      run: bash "${{ github.action_path }}/../../scripts/apt-mirror.sh"

    - name: 安装系统依赖（带缓存）
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
        # 包列表变化时递增，否则会命中旧缓存、缺包。
        version: 1.0
        # 这些包只是库与开发头文件，不需要跑 postinst 里的服务操作。
        execute_install_scripts: false
