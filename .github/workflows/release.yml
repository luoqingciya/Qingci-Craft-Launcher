name: Release

# 发版流程：打 tag → 构建（三平台）→ 签名 → 建 GitHub Release。
#
# 更新通道只有 GitHub Release：客户端从
#   https://github.com/luoqingciya/Qingci-Craft-Launcher/releases/latest/download/latest.json
# 读清单，按里面的地址（同样指向 GitHub）下载，并用内置公钥校验 minisign 签名。
# 所以这里必须用同一个私钥签名——换了私钥，所有已发布的客户端都会拒绝后续更新。
#
# COS（qcl.luoqingciya.cn）已于 2026-11-10 关闭。0.1.14 及更早的客户端端点列表里
# 只有 COS，它们收不到后续更新——这是切换通道的既定代价，不是缺陷。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "手动触发：构建并生成 latest.json，不创建 Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先做一次性校验。独立成 job 是为了让「三处版本不一致」在两台机器开始编译
  # 之前就失败，而不是各自编译五分钟后再报。
  prepare:
    name: 校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # 版本号写在三个地方，任何一处忘了改，客户端就会认为「没有更新」
      # （或者反复提示同一个版本）。Cargo 那处还会进到 User-Agent 与游戏的
      # --version 参数里（qcl_core::LAUNCHER_VERSION），漂移了看不出来。
      - name: 校验版本号一致
        id: version
        shell: bash
        run: |
          set -euo pipefail
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo_version=$(node -e 'const m = require("fs").readFileSync("Cargo.toml", "utf8").match(/^version = "(.*)"$/m); console.log(m ? m[1] : "")')
          echo "version=$conf" >> "$GITHUB_OUTPUT"

          if [ "$conf" != "$pkg" ]; then
            echo "::error::tauri.conf.json 是 $conf，package.json 是 $pkg，必须一致"
            exit 1
          fi
          if [ "$conf" != "$cargo_version" ]; then
            echo "::error::tauri.conf.json 是 $conf，Cargo.toml 的 workspace.package 是 $cargo_version，必须一致"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$conf" ]; then
              echo "::error::标签是 v$tag，配置里是 $conf。先改版本号再打标签"
              exit 1
            fi
          fi

      - name: 检查签名密钥
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY。没有它产不出 .sig，客户端会拒绝安装更新。"
            exit 1
          fi

      # 微软登录的客户端 ID 在编译期注入。缺了它构建不会失败，但产物里登录功能
      # 会静默不可用——那比发版失败更糟：用户装完才发现。
      - name: 检查微软登录客户端 ID
        shell: bash
        env:
          MS_CLIENT_ID: ${{ secrets.QCL_MS_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MS_CLIENT_ID" ]; then
            echo "::error::缺少 QCL_MS_CLIENT_ID。没有它，发出去的安装包无法登录微软账号。"
            echo "在 Azure 应用注册里取「应用程序(客户端) ID」，加到仓库 secret。"
            exit 1
          fi

  build:
    name: 构建 ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            kind: windows
            build: --bundles nsis --config src-tauri/tauri.release.json
          - name: Linux
            # 用 22.04 而不是 latest：glibc 基线 2.35，向下兼容面更广。
            # 24.04 构建的产物在旧发行版上会直接无法启动。
            os: ubuntu-22.04
            kind: linux
            build: --bundles appimage,deb --config src-tauri/tauri.release.json
          - name: macOS
            # 通用二进制：一次构建同时含 arm64 与 x86_64，用户不必挑。
            #
            # 与另外两个平台一样生成 updater 产物（.app.tar.gz + .sig）：
            # 它的解压走 tar+gz，不依赖被关掉的 zip 特性（查过
            # tauri-plugin-updater 2.14.0 的源码，见 src-tauri/Cargo.toml）。
            os: macos-latest
            kind: macos
            build: --bundles dmg,app --config src-tauri/tauri.release-macos.json --target universal-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: 安装 AppImage 打包依赖
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libfuse2
      - name: 安装 macOS 双架构目标
        if: runner.os == 'macOS'
        # 通用二进制要先有这两个 target，Tauri 会把两份产物 lipo 成一个。
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # createUpdaterArtifacts 只在这份 release 配置里打开：它要求构建时必须提供私钥，
      # 而贡献者本地打包不该被这个要求挡住（见 tauri.release.json）。
      # macOS 走 tauri.release-macos.json，那边是关掉的。
      - name: 构建并签名
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 编译期注入，见 src-tauri/build.rs。仓库里没有这个值。
          QCL_MS_CLIENT_ID: ${{ secrets.QCL_MS_CLIENT_ID }}
          # macOS 不签名：没有开发者账号，产物由用户右键「打开」绕过 Gatekeeper。
          # 显式关掉自动发现，免得 runner 上万一存在证书时行为不一致。
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && 'false' || '' }}
        run: pnpm tauri build ${{ matrix.build }}

      # 安装包原名带空格（"Qingci Craft Launcher_0.1.1_x64-setup.exe"）。
      # 换成纯 ASCII 名字，URL 里就不用再操心编码。用 glob 而不是拼文件名：
      # 各平台 Tauri 的架构标记不一样（NSIS 是 x64、AppImage/deb 是 amd64），
      # 拼错了要到发版那天才发现。
      - name: 整理产物
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob

          copy() {  # $1=glob $2=目标名
            local files=($1)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::没有找到匹配 $1 的产物"
              exit 1
            fi
            cp "${files[0]}" "out/$2"
            echo "→ out/$2"
          }

          # 按平台分支：每个 job 只处理自己那套产物。
          # 第一次写成一套通用 glob，结果 Windows 去找 AppImage、Linux 去找
          # NSIS，两个 job 都在这一步挂了（构建本身是成功的）。
          case "$KIND" in
            windows)
              copy "target/release/bundle/nsis/*-setup.exe"     "QingciCraftLauncher_${VERSION}_x64-setup.exe"
              copy "target/release/bundle/nsis/*-setup.exe.sig" "QingciCraftLauncher_${VERSION}_x64-setup.exe.sig"
              # 便携版：就是安装包里的那个 exe，不安装、双击即用，游戏目录落在 exe 旁边。
              # 收到更新提示时装的是 NSIS 版，等于升级成安装版；这个目录本身不会被替换。
              copy "target/release/qcl-desktop.exe"             "QingciCraftLauncher_${VERSION}_x64-portable.exe"
              ;;
            linux)
              copy "target/release/bundle/appimage/*.AppImage"     "QingciCraftLauncher_${VERSION}_x86_64.AppImage"
              copy "target/release/bundle/appimage/*.AppImage.sig" "QingciCraftLauncher_${VERSION}_x86_64.AppImage.sig"
              copy "target/release/bundle/deb/*.deb"               "QingciCraftLauncher_${VERSION}_amd64.deb"
              ;;
            macos)
              # 指定了 --target，产物落在 target/<triple>/ 下而不是 target/release/。
              # `.app.tar.gz` 是 updater 用的格式（dmg 只用于首次安装）；
              # universal 一份产物同时服务 darwin-aarch64 与 darwin-x86_64。
              copy "target/universal-apple-darwin/release/bundle/dmg/*.dmg" "QingciCraftLauncher_${VERSION}_universal.dmg"
              copy "target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz"     "QingciCraftLauncher_${VERSION}_universal.app.tar.gz"
              copy "target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig" "QingciCraftLauncher_${VERSION}_universal.app.tar.gz.sig"
              ;;
            *)
              echo "::error::未知平台 $KIND"
              exit 1
              ;;
          esac

          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # 合并各平台产物、生成清单、建 Release。
  # 单独成 job 而不是塞进 build：latest.json 要同时包含三个平台的签名，
  # 只有拿到全部产物之后才写得出来。
  publish:
    name: 发布
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: 生成更新清单
        shell: bash
        env:
          # 所有平台的下载地址都指向 GitHub Release——这是唯一的更新通道。
          DOWNLOAD_BASE_URL: "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            notes="Qingci Craft Launcher ${VERSION}. Full notes: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          else
            notes="Qingci Craft Launcher ${VERSION} (manual build, not a published release)"
          fi

          # 每个桌面平台一项。签名是构建时用同一个 minisign 私钥生成的，
          # 客户端换平台也用同一把内置公钥校验。
          # macOS 的 universal 产物写两条（darwin-aarch64 / darwin-x86_64），
          # 指向同一个文件；Linux 只写 AppImage——deb 由包管理器管，不该自更新。
          platforms=()
          add() {  # $1=目标 $2=glob
            local files=($2)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::没有找到匹配 $2 的产物，无法生成清单"
              exit 1
            fi
            platforms+=(--platform "$1=${files[0]}=${files[0]}.sig")
          }
          add windows-x86_64 "out/*x64-setup.exe"
          add linux-x86_64   "out/*x86_64.AppImage"
          add darwin-aarch64 "out/*universal.app.tar.gz"
          add darwin-x86_64  "out/*universal.app.tar.gz"

          node scripts/make-latest-json.mjs \
            --version "$VERSION" \
            --base-url "$DOWNLOAD_BASE_URL" \
            --notes "$notes" \
            "${platforms[@]}" \
            --out out/latest.json

          cat out/latest.json
          ls -l out

      - name: 创建 GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 重跑同一次发版时 Release 可能已经存在。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* \
              --title "Qingci Craft Launcher v${VERSION}" \
              --generate-notes
          fi
