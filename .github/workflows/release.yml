name: Release

# 发版流程：打 tag → 构建（Windows / Linux）→ 签名 → 推送 COS → 建 GitHub Release。
#
# 客户端启动后从 https://qcl.luoqingciya.cn/releases/latest.json 读清单，
# 按里面的地址下载安装包，并用内置公钥校验 minisign 签名。所以这里必须
# 用同一个私钥签名——换了私钥，所有已发布的客户端都会拒绝后续更新。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建并生成 latest.json，不推送 COS、不创建 Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 桶名与地域不是机密：它们出现在每一个下载地址里。机密是下面两个 secret。
  COS_BUCKET: qcl-1331847184
  COS_REGION: ap-guangzhou
  COS_PREFIX: releases
  PUBLIC_BASE_URL: https://qcl.luoqingciya.cn/releases

jobs:
  # 先做一次性校验。独立成 job 是为了让「三处版本不一致」在两台机器开始编译
  # 之前就失败，而不是各自编译五分钟后再报。
  prepare:
    name: 校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # 版本号写在三个地方，任何一处忘了改，客户端就会认为「没有更新」
      # （或者反复提示同一个版本）。Cargo 那处还会进到 User-Agent 与游戏的
      # --version 参数里（qcl_core::LAUNCHER_VERSION），漂移了看不出来。
      - name: 校验版本号一致
        id: version
        shell: bash
        run: |
          set -euo pipefail
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo_version=$(node -e 'const m = require("fs").readFileSync("Cargo.toml", "utf8").match(/^version = "(.*)"$/m); console.log(m ? m[1] : "")')
          echo "version=$conf" >> "$GITHUB_OUTPUT"

          if [ "$conf" != "$pkg" ]; then
            echo "::error::tauri.conf.json 是 $conf，package.json 是 $pkg，必须一致"
            exit 1
          fi
          if [ "$conf" != "$cargo_version" ]; then
            echo "::error::tauri.conf.json 是 $conf，Cargo.toml 的 workspace.package 是 $cargo_version，必须一致"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$conf" ]; then
              echo "::error::标签是 v$tag，配置里是 $conf。先改版本号再打标签"
              exit 1
            fi
          fi

      - name: 检查签名密钥
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY。没有它产不出 .sig，客户端会拒绝安装更新。"
            exit 1
          fi

      # 微软登录的客户端 ID 在编译期注入。缺了它构建不会失败，但产物里登录功能
      # 会静默不可用——那比发版失败更糟：用户装完才发现。
      - name: 检查微软登录客户端 ID
        shell: bash
        env:
          MS_CLIENT_ID: ${{ secrets.QCL_MS_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MS_CLIENT_ID" ]; then
            echo "::error::缺少 QCL_MS_CLIENT_ID。没有它，发出去的安装包无法登录微软账号。"
            echo "在 Azure 应用注册里取「应用程序(客户端) ID」，加到仓库 secret。"
            exit 1
          fi

  build:
    name: 构建 ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            kind: windows
            bundles: nsis
          - name: Linux
            # 用 22.04 而不是 latest：glibc 基线 2.35，向下兼容面更广。
            # 24.04 构建的产物在旧发行版上会直接无法启动。
            os: ubuntu-22.04
            kind: linux
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: 安装 AppImage 打包依赖
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libfuse2

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # createUpdaterArtifacts 只在这份 release 配置里打开：它要求构建时必须提供私钥，
      # 而贡献者本地打包不该被这个要求挡住（见 tauri.release.json）。
      - name: 构建并签名
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 编译期注入，见 src-tauri/build.rs。仓库里没有这个值。
          QCL_MS_CLIENT_ID: ${{ secrets.QCL_MS_CLIENT_ID }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.json

      # 安装包原名带空格（"Qingci Craft Launcher_0.1.1_x64-setup.exe"）。
      # 换成纯 ASCII 名字，URL 里就不用再操心编码。用 glob 而不是拼文件名：
      # 各平台 Tauri 的架构标记不一样（NSIS 是 x64、AppImage/deb 是 amd64），
      # 拼错了要到发版那天才发现。
      - name: 整理产物
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob

          copy() {  # $1=glob $2=目标名
            local files=($1)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::没有找到匹配 $1 的产物"
              exit 1
            fi
            cp "${files[0]}" "out/$2"
            echo "→ out/$2"
          }

          # 按平台分支：每个 job 只处理自己那套产物。
          # 第一次写成一套通用 glob，结果 Windows 去找 AppImage、Linux 去找
          # NSIS，两个 job 都在这一步挂了（构建本身是成功的）。
          case "$KIND" in
            windows)
              copy "target/release/bundle/nsis/*-setup.exe"     "QingciCraftLauncher_${VERSION}_x64-setup.exe"
              copy "target/release/bundle/nsis/*-setup.exe.sig" "QingciCraftLauncher_${VERSION}_x64-setup.exe.sig"
              # 便携版：就是安装包里的那个 exe，不安装、双击即用，游戏目录落在 exe 旁边。
              # 它**不进 COS**，也不参与自动更新——自更新要替换正在运行的 exe，Windows 不允许。
              # 名字刻意不含 `x64-setup`：COS 的上传清单按 `*x64-setup.exe` 过滤，
              # 这样便携版不会被顺带传上去。
              copy "target/release/qcl-desktop.exe"             "QingciCraftLauncher_${VERSION}_x64-portable.exe"
              ;;
            linux)
              copy "target/release/bundle/appimage/*.AppImage"     "QingciCraftLauncher_${VERSION}_x86_64.AppImage"
              copy "target/release/bundle/appimage/*.AppImage.sig" "QingciCraftLauncher_${VERSION}_x86_64.AppImage.sig"
              copy "target/release/bundle/deb/*.deb"               "QingciCraftLauncher_${VERSION}_amd64.deb"
              ;;
            *)
              echo "::error::未知平台 $KIND"
              exit 1
              ;;
          esac

          ls -l out

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # 合并各平台产物、生成清单、推送 COS、建 Release。
  # 单独成 job 而不是塞进 build：latest.json 要同时包含两个平台的签名，
  # 只有拿到全部产物之后才写得出来。
  #
  # 用 windows-latest 而不是 ubuntu：到 COS 广州是国际链路，COS 会在带宽不达标时
  # 直接回 400 UserNetworkTooSlow。目前唯一一次成功的大文件上传是在 Windows runner
  # 上发生的，先沿用它；脚本里另有退避重试兜底。
  publish:
    name: 发布
    needs: [prepare, build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      # 上传脚本要 import cos-nodejs-sdk-v5，所以这个 job 也得装依赖。
      # 只是装依赖，不编译任何东西。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成更新清单
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            notes="Qingci Craft Launcher ${VERSION}. Full notes: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          else
            notes="Qingci Craft Launcher ${VERSION} (manual build, not a published release)"
          fi

          # 清单里只有 Windows。Linux 的 AppImage 不上 COS（80 MB，而且只是自包含的
          # 打包结果），所以清单里没有 linux 条目——Linux 用户从 GitHub Release 手动下载。
          # 客户端那边也会据此把 Linux 判为「不支持自动更新」，不会给出一个点了就报错的按钮。
          platforms=()
          add() {  # $1=目标 $2=glob
            local files=($2)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::没有找到匹配 $2 的产物，无法生成清单"
              exit 1
            fi
            platforms+=(--platform "$1=${files[0]}=${files[0]}.sig")
          }
          add windows-x86_64 "out/*x64-setup.exe"

          node scripts/make-latest-json.mjs \
            --version "$VERSION" \
            --base-url "$PUBLIC_BASE_URL" \
            --notes "$notes" \
            "${platforms[@]}" \
            --out out/latest.json

          cat out/latest.json
          ls -l out

      # COS 只放「自动更新需要的东西」：Windows 安装包、它的签名、清单。
      # Linux 的 AppImage 与 deb 只进 GitHub Release——AppImage 有 80 MB，
      # 传 COS 又慢又占带宽，而它本来就不参与自动更新。
      - name: 预览将要上传的对象（dry run）
        if: github.event_name != 'push' && github.event.inputs.dry_run != 'false'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for file in out/*x64-setup.exe out/*x64-setup.exe.sig out/latest.json; do
            if [ -f "$file" ]; then args+=(--file "$file"); fi
          done
          node scripts/publish-cos.mjs \
            --bucket "$COS_BUCKET" --region "$COS_REGION" --prefix "$COS_PREFIX" \
            "${args[@]}" --dry-run

      # 清单最后上传（脚本里保证顺序）：它一可读，客户端就会照着里面的地址下载。
      - name: 推送 COS
        if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
        shell: bash
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          set -euo pipefail
          args=()
          for file in out/*x64-setup.exe out/*x64-setup.exe.sig out/latest.json; do
            if [ -f "$file" ]; then args+=(--file "$file"); fi
          done
          node scripts/publish-cos.mjs \
            --bucket "$COS_BUCKET" --region "$COS_REGION" --prefix "$COS_PREFIX" \
            "${args[@]}"

      - name: 创建 GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 重跑同一次发版时 Release 可能已经存在。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* \
              --title "Qingci Craft Launcher v${VERSION}" \
              --generate-notes
          fi
