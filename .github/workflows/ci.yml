name: CI

# PR 门禁：任何改动在合并前必须通过本文件定义的全部 job。
# 这些 job 名称同时是 main 分支保护的 required status checks，重命名需同步修改分支保护配置。
#
# 两次触发不是重复劳动，但**大部分是**：
#
#   pull_request  分支上跑全套（含三平台构建）——这是真正的门禁
#   push: main    合并后再跑一遍
#
# 分支保护开了 strict（要求 PR 分支与 main 同步），所以合并出来的树与 PR head
# 完全一致，第二次跑的是同一份内容。合并后只保留「不产出、纯验证」里最便宜的那层，
# 三平台构建只在 PR 上跑——见 build job 上的注释。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # 最快的反馈放在最前面：格式错误不该等三平台编译完才报出来。
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # 与 rust-toolchain.toml 保持一致，升级时两处同改
          toolchain: "1.99.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Linux 构建依赖
        uses: ./.github/actions/linux-deps
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # 三平台矩阵：跨平台项目最常见的失败模式是"本机通过、其他平台失败"，
  # 因此测试必须在三个真实操作系统上跑，而不是只跑 Linux。
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - run: cargo test --workspace --all-features

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: 安装 Linux 构建依赖
        uses: ./.github/actions/linux-deps
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          # 覆盖率只做趋势观察，不阻断合并；达标要求由评审把关。
          fail_ci_if_error: false

  # 前端门禁：lint → 单元测试 → 类型检查与生产构建。
  # 顺序刻意如此：lint 与测试都比完整打包快，先失败能省时间。
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        if: hashFiles('package.json') != ''
      - uses: actions/setup-node@v7
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        if: hashFiles('package.json') != ''
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: hashFiles('package.json') != ''
        run: pnpm lint
      - name: 单元测试
        if: hashFiles('package.json') != ''
        run: pnpm test
      - name: 类型检查与生产构建
        if: hashFiles('package.json') != ''
        run: pnpm build

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # 验证三平台是否真的能编译出 Tauri 应用。此 job 的存在是为了让
  # "签名 / WebView 依赖 / 交叉编译"这类问题在合并前暴露，而不是在发版时。
  #
  # 它也是最贵的一环（实测三平台合计约 600 秒）。但只有改动 Rust / Tauri / 前端构建
  # 配置时才有意义——纯文档或纯 CI 改动跑一遍完整编译只是白等。所以用路径过滤：
  # 不相关时跳过重活，job 本身仍然成功，避免卡住必需的状态检查。
  build:
    name: build (${{ matrix.os }})
    # 只在 PR 上跑。
    #
    # 分支保护要求 PR 分支与 main 保持同步（strict），所以合并出来的树与 PR head
    # 完全一致——合并后再编译一遍三个平台纯属重复。而构建产物在 CI 里没有任何
    # 下游消费者（发版由 release.yml 自己构建），删掉不影响任何东西。
    #
    # 这是每次合并能省下的最大一块：三个构建加起来约 12 分钟机器时间。
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - 'crates/**'
              - 'src-tauri/**'
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - 'index.html'
              - '.github/workflows/**'
              - '.github/actions/**'
      - name: 说明跳过原因
        if: steps.changes.outputs.code != 'true'
        run: echo "本次改动未触及代码或构建配置，跳过三平台编译（其余 job 仍会运行）"
      - uses: dtolnay/rust-toolchain@master
        if: steps.changes.outputs.code == 'true' && hashFiles('src-tauri/tauri.conf.json') != ''
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.code == 'true' && hashFiles('src-tauri/tauri.conf.json') != ''
      - name: 安装 Linux 构建依赖
        if: steps.changes.outputs.code == 'true' && hashFiles('src-tauri/tauri.conf.json') != '' && runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.code == 'true' && hashFiles('package.json') != ''
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.code == 'true' && hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        if: steps.changes.outputs.code == 'true' && hashFiles('package.json') != ''
        run: pnpm install --frozen-lockfile
      - name: 编译（不打包，仅验证可编译）
        if: steps.changes.outputs.code == 'true' && hashFiles('src-tauri/tauri.conf.json') != ''
        run: pnpm tauri build --no-bundle
