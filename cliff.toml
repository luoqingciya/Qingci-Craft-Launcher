# git-cliff 配置：从 Conventional Commits 生成 CHANGELOG.md
#
# 用法：
#   git cliff --config cliff.toml -o CHANGELOG.md        # 重新生成全量
#   git cliff --config cliff.toml --unreleased           # 仅预览未发布部分
#
# 本项目使用 Squash 合并，PR 标题即提交信息，因此提交信息的规范程度直接决定本文件的质量。

[changelog]
header = """
# 更新日志

本项目所有值得注意的变更都记录在此文件。

格式参考 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，
版本号遵循 [语义化版本](https://semver.org/lang/zh-CN/)。

> 本文件由 git-cliff 依据 Conventional Commits 自动生成，请勿手工编辑。
> 生成命令见 CONTRIBUTING.md。

"""
body = """\
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [未发布]
{% endif -%}
{% for group in ["新增", "修复", "性能", "重构", "文档", "测试", "持续集成", "构建", "依赖更新", "样式", "其他", "回滚"] -%}
{% set items = commits | filter(attribute="group", value=group) -%}
{% if items | length > 0 %}
### {{ group }}

{% for commit in items -%}
- {% if commit.scope %}**{{ commit.scope }}**：{% endif %}{{ commit.message | split(pat="\\n") | first | trim }}
{% endfor -%}
{% endif -%}
{% endfor %}

"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# 未匹配任何规则的非规范提交会被丢弃（例如仓库初始化时的 "Initial commit"）。
filter_commits = true
commit_parsers = [
  { message = "^Initial commit", skip = true },
  { message = "^feat", group = "新增" },
  { message = "^fix", group = "修复" },
  { message = "^perf", group = "性能" },
  { message = "^refactor", group = "重构" },
  { message = "^docs", group = "文档" },
  { message = "^test", group = "测试" },
  { message = "^ci", group = "持续集成" },
  { message = "^build", group = "构建" },
  { message = "^chore\\(deps\\)", group = "依赖更新" },
  { message = "^chore", group = "其他" },
  { message = "^style", group = "样式" },
  { message = "^revert", group = "回滚" },
]
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
