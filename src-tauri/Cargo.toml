[package]
name = "qcl-desktop"
description = "Qingci Craft Launcher 的 Tauri 应用层（薄适配，不含业务算法）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# Tauri 2 的惯例：库名带 _lib 后缀，避免与可执行文件同名导致链接冲突。
name = "qcl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# 同时给出 version 与 path：只写 path 会被 cargo-deny 判为通配依赖（wildcard）。
qcl-core = { version = "0.1.0", path = "../crates/qcl-core" }
qcl-net = { version = "0.1.0", path = "../crates/qcl-net" }
qcl-install = { version = "0.1.0", path = "../crates/qcl-install" }
qcl-java = { version = "0.1.0", path = "../crates/qcl-java" }
qcl-runtime = { version = "0.1.0", path = "../crates/qcl-runtime" }
qcl-platform = { version = "0.1.0", path = "../crates/qcl-platform" }
qcl-mods = { version = "0.1.0", path = "../crates/qcl-mods" }
qcl-auth = { version = "0.1.0", path = "../crates/qcl-auth" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
dunce.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# 关掉默认的 `zip` 特性：它只用于解压 v1 遗留格式（.nsis.zip、压缩 AppImage）。
# 我们发的是裸 .exe（Windows，走 `extract_exe`）、裸 AppImage（Linux）、
# `.app.tar.gz`（macOS，用 tar+gz 解压，不走 zip crate），都用不到它；
# 而它带进来的 zip 4.x 有两个未修复的漏洞（RUSTSEC-2026-0367 解压时保留
# SUID/SGID、RUSTSEC-2026-0368 解压出的符号链接可指向目标目录之外）。
# 注意：曾经以为 macOS 的 .app.tar.gz 也依赖 zip，查过 tauri-plugin-updater
# 2.14.0 的源码后才确认那是 tar+gz，与 zip 无关。
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = [
    "rustls-tls",
    "system-proxy",
] }
tauri-plugin-process = "2.4.0"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
tauri-plugin-single-instance = "2.5.4"

[dev-dependencies]
tempfile = "3.27.0"
