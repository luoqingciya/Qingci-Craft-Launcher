[package]
name = "qcl-desktop"
description = "Qingci Craft Launcher 的 Tauri 应用层（薄适配，不含业务算法）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# Tauri 2 的惯例：库名带 _lib 后缀，避免与可执行文件同名导致链接冲突。
name = "qcl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# 同时给出 version 与 path：只写 path 会被 cargo-deny 判为通配依赖（wildcard）。
qcl-core = { version = "0.1.0", path = "../crates/qcl-core" }
qcl-net = { version = "0.1.0", path = "../crates/qcl-net" }
qcl-install = { version = "0.1.0", path = "../crates/qcl-install" }
qcl-java = { version = "0.1.0", path = "../crates/qcl-java" }
qcl-runtime = { version = "0.1.0", path = "../crates/qcl-runtime" }
qcl-platform = { version = "0.1.0", path = "../crates/qcl-platform" }
qcl-mods = { version = "0.1.0", path = "../crates/qcl-mods" }
qcl-auth = { version = "0.1.0", path = "../crates/qcl-auth" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
dunce.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# 关掉默认的 `zip` 特性：它只用于解压「打成 zip 的更新包」（旧式 .nsis.zip、
# Linux 的压缩 AppImage、macOS 的 .tar.gz）。我们发的是裸 .exe，安装走
# `extract_exe`，用不到它；而它带进来的 zip 4.x 有两个未修复的漏洞
# （RUSTSEC-2026-0367 解压时保留 SUID/SGID、RUSTSEC-2026-0368 解压出的符号链接
# 可指向目标目录之外）。代价是将来若改发 zip 包，安装会直接报错而不是静默解压。
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = [
    "rustls-tls",
    "system-proxy",
] }
tauri-plugin-process = "2.4.0"

[dev-dependencies]
tempfile = "3.27.0"
