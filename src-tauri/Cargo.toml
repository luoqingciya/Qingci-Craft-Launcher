[package]
name = "qcl-desktop"
description = "Qingci Craft Launcher 的 Tauri 应用层（薄适配，不含业务算法）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# Tauri 2 的惯例：库名带 _lib 后缀，避免与可执行文件同名导致链接冲突。
name = "qcl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# 同时给出 version 与 path：只写 path 会被 cargo-deny 判为通配依赖（wildcard）。
qcl-core = { version = "0.1.0", path = "../crates/qcl-core" }
qcl-net = { version = "0.1.0", path = "../crates/qcl-net" }
qcl-install = { version = "0.1.0", path = "../crates/qcl-install" }
qcl-java = { version = "0.1.0", path = "../crates/qcl-java" }
qcl-runtime = { version = "0.1.0", path = "../crates/qcl-runtime" }
qcl-platform = { version = "0.1.0", path = "../crates/qcl-platform" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
dunce.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
