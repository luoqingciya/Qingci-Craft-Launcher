[workspace]
resolver = "3"
members = ["crates/qcl-core", "crates/qcl-net", "crates/qcl-java", "crates/qcl-runtime", "crates/qcl-install", "crates/qcl-cli", "crates/qcl-platform", "crates/qcl-auth", "crates/qcl-mods", "src-tauri"]

[workspace.package]
version = "0.1.10"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
repository = "https://github.com/luoqingciya/Qingci-Craft-Launcher"
authors = ["luoqingci <luoqingci@luoqingciya.com.cn>"]
publish = false

[workspace.dependencies]
# 第三方依赖统一在此声明版本，成员 crate 通过 `xxx.workspace = true` 引入，
# 保证整个 workspace 的版本只有一个来源。
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
regex-lite = "0.1.9"
sha1 = "0.11.0"
# 私有仓库（译名库）用 SHA-256 而不是 SHA-1：那是我们自己发的包，没理由沿用旧摘要。
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net", "process", "signal"] }
reqwest = { version = "0.13.5", features = ["stream", "json", "form"] }
futures-util = "0.3.34"
async-trait = "0.1.92"
# 只解压 natives 归档，不需要压缩、加密与其它压缩算法。
# 默认特性会引入 aes/bzip2/lzma/zstd/xz/ppmd 等一整套实现，对本项目是纯粹的体积浪费。
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Windows 上把 `\\?\C:\...` 规范化回 `C:\...`。标准库的 canonicalize 会加 verbatim
# 前缀，它原样显示在界面上极难辨认，也会被塞进 `${game_directory}` 传给游戏。
dunce = "1.0.5"

# 仅用于测试
insta = { version = "1.49.0", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
# panic = "abort"：需先确认 Tauri 插件不依赖 catch_unwind，Phase 2 验证通过后再启用。
